name: Lectio
options:
  bundleIdPrefix: com.sdit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "72D37KMVAU"
    CODE_SIGN_STYLE: Automatic
targets:
  Lectio:
    type: application
    platform: iOS
    # iCloud key–value sync for the personal layer (saved words, highlights, reading
    # places, My Collection) via CloudStore/NSUbiquitousKeyValueStore. Active in signed
    # builds with the iCloud capability; degrades to local-only otherwise.
    entitlements:
      path: Lectio.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    sources:
      - path: Lectio
      # The content bundle lives at the repo root; include it as a folder
      # reference so its directory structure is preserved inside the app bundle.
      - path: ../content
        type: folder
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.sdit.Lectio
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
