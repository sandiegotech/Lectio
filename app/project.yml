name: Lectio
options:
  bundleIdPrefix: org.sandiegotech
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "72D37KMVAU"
    CODE_SIGN_STYLE: Automatic
targets:
  Lectio:
    type: application
    platform: iOS
    # iCloud key–value sync for the personal layer (saved words, highlights, reading
    # places) via CloudStore/NSUbiquitousKeyValueStore. Active in signed
    # builds with the iCloud capability; degrades to local-only otherwise.
    entitlements:
      path: Lectio.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    sources:
      - path: Lectio
      # The content bundle lives at the repo root; include it as a folder
      # reference so its directory structure is preserved inside the app bundle.
      - path: ../content
        type: folder
        buildPhase: resources
    # The shelf art for works that are not published yet lives in content/ for the
    # pipeline and the website, but the app shows only what can be read. Strip it from
    # the built app (31 MB) rather than fork the content folder.
    postBuildScripts:
      - name: Strip unpublished shelf covers
        script: rm -rf "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/content/collections/book-covers"
        basedOnDependencyAnalysis: false
    # Explicit Info.plist, generated by XcodeGen from the properties below.
    info:
      path: Lectio/Info.plist
      properties:
        # Version and build come from the build settings below, so a release is one edit.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Standard HTTPS/OS crypto only: skips the export-compliance question on every upload.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: org.sandiegotech.Lectio
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
